<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eco Tech Entregas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #007f8b;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="eco_transparente.png" alt="Eco Tech Entregas" style="height: 100px;" class="me-2">
      </a>
      <div class="eco-nav-actions">
        <a href="cadastro.html" class="btn btn-outline-light me-2">👤 Cadastro</a>
        <a href="login.html" class="btn btn-outline-light me-2">🔑 Login</a>
        <a href="compras.html" class="btn btn-light">🛒 Carrinho</a>
      </div>
      <a class="btn btn-github-eco" href="https://github.com/fillipeoribeiro99/app_de_delivery" target="_blank" rel="noopener noreferrer" aria-label="Ver código do Eco Tech Entregas no GitHub">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.637 22.41c.575.106.787-.25.787-.556v-2.02c-3.2.695-3.875-1.36-3.875-1.36-.523-1.33-1.277-1.685-1.277-1.685-1.044-.713.08-.698.08-.698 1.155.08 1.763 1.186 1.763 1.186 1.026 1.758 2.69 1.25 3.345.955.104-.744.402-1.25.732-1.537-2.555-.29-5.24-1.278-5.24-5.685 0-1.256.45-2.282 1.185-3.087-.12-.29-.514-1.46.112-3.04 0 0 .966-.31 3.164 1.18a10.99 10.99 0 0 1 5.76 0c2.198-1.49 3.162-1.18 3.162-1.18.628 1.58.233 2.75.115 3.04.737.805 1.183 1.831 1.183 3.087 0 4.418-2.69 5.392-5.253 5.676.413.357.78 1.06.78 2.137v3.17c0 .31.208.668.793.555A11.5 11.5 0 0 0 12 .5Z"/></svg>
        <span>Ver código no GitHub</span>
      </a>
    </div>
  </nav>

  <div class="text-center my-4">
    <p class="text-muted">Conectando você com restaurantes eco sustentáveis com tecnologia e eficiência.</p>
  </div>

  <div class="form-check form-switch text-end mb-4 px-4">
    <input class="form-check-input" type="checkbox" id="ecoSwitch">
    <label class="form-check-label" for="ecoSwitch">Mostrar apenas opções ecológicas</label>
  </div>

  <div class="row px-4" id="restaurantList"></div>

  <script src="script.js"></script>

  <script>
    const navbar = document.querySelector('.eco-nav-actions');
    const isLoggedIn = localStorage.getItem('isLoggedIn');

    if (isLoggedIn) {
      navbar.innerHTML = \`
        <button id="logoutBtn" class="btn btn-outline-light me-2">🚪 Sair</button>
        <a href="compras.html" class="btn btn-light">🛒 Carrinho</a>
      \`;

      document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('userEmail');
        alert('Logout realizado com sucesso!');
        window.location.reload();
      });
    }
  </script>
</body>
</html>
